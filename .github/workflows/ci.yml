name: build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# The gate the whole change rests on: root + webview-ui typecheck, the host
# and webview bundles, and both vitest suites. The live-runtime smoke test
# stays env-gated (`MANOX_SMOKE`) and is skipped here — it needs a staged
# `manox_napi.node` and (for the client-tool round-trip) a model provider.
jobs:
  compile-test:
    name: compile + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install (host + webview-ui)
        # `npm install`, not `npm ci`: the committed lockfiles are generated
        # on macOS arm64 and npm's `ci` refuses a Linux runner whose
        # platform-specific optional binaries (esbuild) are absent from the
        # lockfile. `install` resolves the runner's own optionals; the
        # compile/test gate (not byte-for-byte reproducibility) is the point.
        run: npm install --no-audit --no-fund && npm install --no-audit --no-fund --prefix webview-ui

      - name: Compile (typecheck + host esbuild + webview bundles)
        run: npm run compile

      - name: Test (host + webview-ui vitest)
        run: npm test
